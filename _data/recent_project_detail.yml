- name : 드래곤 플라이트 리부트
  engName : Dragon Flight Reboot
  index : 2
  video : video/DFR.webm
  icon : icon/DFR.png
  url : /profile/
  desc : LINE GAMES에서, 드래곤 플라이트 IP를 활용한 슈팅 액션 게임의 클라이언트 개발에 참여함. 몬스터 및 플레이어의 전투 시스템과 몬스터 A.I. 로직 및 패턴 기능, 스테이지 및 웨이브 시스템, 상태 이상 시스템 등 인게임 시스템 전반 구조를 개발하였으며, 스킬트리 시스템과 보급소 등 아웃 게임에도 기여함.
  task :
    - 스테이지, 웨이브, 몬스터 패턴 등 JSON 형태로 된 데이터 파서 시스템을 직접 구현하여 기획자가 쉽게 구조를 변경하거나 테스트할 수 있는 환경을 구축함
    - Spine 라이브러리를 래핑한 2D 애니메이터 시스템을 직접 구현하여, 애니메이션 믹싱, 이벤트 핸들러와 같은 다양한 기능을 프로젝트에 맞게 제공함
    - 보스 및 엘리트 몬스터의 다양한 패턴 및 페이즈 시스템과 같은 자체 라이프 사이클 관리 시스템을 구현함
    - Unity Profiler, Unity Frame Debugger를 통해 최적화 이슈를 해결하고, 다양한 이슈를 해결함

- name : 엄마 찾아 탕탕탕!
  engName : Where is mom? bang bang bang!
  index : 3
  video : video/TT3D.webm
  icon : icon/TT3D.png
  url : /profile/
  desc : 인디게임 개발 소모임 퍼플잼에서, 캐주얼 액션 로그라이크 모바일 게임 개발의 인게임 클라이언트 개발에 참여함. 인게임 전투 로직 개발을 전담하고, 기획 의도에 맞는 몬스터 A.I.와 이를 위한 몬스터 라이프 사이클 시스템을 직접 구현하였으며, 성능이 좋지 못한 구형 기기에서도 원활한 게임 플레이가 가능하도록 최적화 작업을 구현함.
  task :
    - Stat 시스템과 대미지 처리, 투사체 및 오브젝트간 피격 처리를 구현하여 전투 시스템을 구축함
    - 전략 패턴 기반의 몬스터 A.I. 로직을 구현하고, Scriptable Object 기반의 커스텀 에디터를 만들어 누구나 A.I.를 수정하고 테스트할 수 있는 기능을 추가함
    - 애니메이터와 협업할 수 있도록 애니메이션 이벤트 핸들러와 캐릭터 A.I.를 연동함
    - Unity의 Deep Profiling 기능으로 셰이더 및 프로젝트 세팅에서 이슈를 찾아 GPU 바운드 최적화를 진행함

- name : 캣잼
  engName : Cat Jam
  index : 4
