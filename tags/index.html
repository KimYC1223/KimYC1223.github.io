<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>테크노트로 이동합니다</title>
  <meta name="robots" content="noindex">
  <script>
    (function () {
      var tag = new URLSearchParams(location.search).get('tag');
      location.replace('/tech/' + (tag ? '?tag=' + encodeURIComponent(tag) : ''));
    })();
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=/tech/"></noscript>
</head>
<body>
  <p>테크노트 목록으로 이동합니다. 이동되지 않으면 <a href="/tech/">여기</a>를 눌러 주세요.</p>
</body>
</html>
